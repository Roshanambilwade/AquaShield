version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - node -e "if (!process.env.VITE_API_BASE_URL?.startsWith('https://')) throw new Error('Set the public HTTPS backend /api URL before deploying')"
            - npm ci --include=dev --no-audit --no-fund
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - ~/.npm/**/*
